# 示例领域意图声明：抄改这个文件即可让 JEV/LLM 识别你的新领域。
# 默认注册表不启用 example；按需在 domains/registry.py 登记后生效。
name: example
description: 示例领域，用于演示如何声明新领域与意图
description_en: "Example domain demonstrating how to declare a new domain and its intents"
version: 0.1.0
capabilities: []
intents:
  - name: 示例问候
    description: 向示例领域打招呼，验证新领域意图已被识别
    description_en: Greet the example domain to verify its intents are recognized
    examples:
      - 你好，示例领域
      - hello example
    risk: low
    mode: conversation
