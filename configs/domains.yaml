# 运行时回退清单：只声明「没有对应领域插件」的领域。
#
# claims / investment 的意图与能力声明在各自插件目录的 manifest.yaml 中，
# 由 DomainRegistry.from_plugins() 聚合，本文件不再重复维护它们的意图树。
# 这样新增领域只改插件，不必同步改这里（同名但内容不一致会在启动时报错）。
#
# 每个意图的 capability 是对话图的落点，由 agent_core/capabilities.py 按名字分派实现；
# 未声明能力时按 mode / risk 回落到内核内置能力：conversation+low → answer，
# case 或 high → guard（拦截确认，不自动执行）。general 没有插件，走内置 answer。
#
# 需要完整三域清单的离线评测 / 契约测试，请用
# domains.registry.default_domain_registry() 从插件聚合，而不是加载本文件。
#
# description_en / 意图 description_en 供 JEV 使用；JEV 是英文优先模型。
version: 1
domains:
  - name: general
    description: 与理赔、投资无关的一般问题
    description_en: General questions unrelated to insurance claims or investments
    version: 1.0.0
    # answer 是内核内置能力：general 没有插件，直接复用兜底回答。
    capabilities: [answer]
    intents:
      - name: 一般咨询
        description: 与理赔、保单、投资理财无关的一般知识或日常问题
        description_en: General knowledge or everyday questions unrelated to claims, policies, or investments
        examples:
          - 今天天气怎么样？
          - Python 怎么读取 CSV？
        risk: low
        mode: conversation
        capability: answer
